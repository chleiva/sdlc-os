[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "issue-tracker"
version = "0.1.0"
description = "D4: Issue-Tracker Integration (Jira Cloud REST API v3) for SDLC Auto (Wave 1)"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "jsonschema>=4.20",
    "mcp==2.2.0",
    "anyio>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/issue_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
