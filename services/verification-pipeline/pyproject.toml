[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verification-pipeline"
version = "0.1.0"
description = "D7: Verification Pipeline (SDLC Auto, Wave 1) -- Sec. 11's seven verification layers."
requires-python = ">=3.11"
dependencies = [
    "mcp==2.2.0",
    "jsonschema==4.26.0",
    "anyio==4.15.1",
    "tree-sitter==0.26.0",
    "tree-sitter-python==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "ruff==0.16.7",
    "mypy==2.3.1",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/verification_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = ["tests/fixtures", ".venv", "*.egg"]
