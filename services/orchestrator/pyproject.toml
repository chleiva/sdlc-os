[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orchestrator"
version = "0.1.0"
description = "D2: Agent Orchestrator Core (SDLC Auto, Wave 1)"
requires-python = ">=3.11"
# `run-registry` (F2) is a real, direct dependency -- installed from its
# local path (`pip install -e ../run-registry`), not from a package
# index, since it is a sibling in-repo deliverable, not a published
# package. Not listed here because a plain `pip install .` would then try
# (and fail) to resolve "run-registry" from PyPI; see README "Setup".
dependencies = [
    "mcp==2.2.0",
    "jsonschema>=4.21",
    "anyio>=4.0",
    # (New, Rev 9) bedrock_backend.py's real boto3 bedrock-runtime client
    # (Section 13.8's Amazon Bedrock vendor option) -- this package's first
    # AWS SDK dependency; ollama_backend.py/anthropic_backend.py/
    # openai_backend.py all use stdlib urllib instead, no new dependency
    # needed for those three vendors.
    "boto3>=1.43.91",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
