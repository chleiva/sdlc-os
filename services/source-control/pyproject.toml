[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "source-control"
version = "0.1.0"
description = "D5: Source-Control Integration (GitHub App), SDLC Auto, Wave 1"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0",
    "mcp==2.2.0",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/source_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
