version: 2
updates:
  # Keep the CI workflow's own actions up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Every services/<name> package's own pinned third-party dependencies
  # (requirements.txt or pyproject.toml). Sibling in-repo packages
  # (file:../other-service) aren't PyPI releases and Dependabot doesn't
  # touch them; a directory with no manifest is silently skipped.
  #
  # Real problem found on this config's first live run: without
  # `groups`, each (directory, dependency) pair gets its own PR --
  # across ~15 service directories that's dozens of PRs on the very
  # first run, each triggering the full CI matrix at once and queueing
  # every job behind every other (a public repo has unlimited included
  # Actions minutes, but the account-wide *concurrent job* count is
  # still capped). `group-by: dependency-name` collapses all directories'
  # updates for the same dependency into one PR instead of one per
  # directory, and open-pull-requests-limit caps how many are open at
  # once regardless.
  - package-ecosystem: "pip"
    directories:
      - "/services/*"
    schedule:
      interval: "weekly"
    groups:
      per-dependency:
        group-by: dependency-name
    open-pull-requests-limit: 10

  # infra/'s own OpenTofu provider version pins. Real problem found on
  # this config's first live run: `directory: "/infra"` errored with
  # "No files found in /infra" -- the terraform ecosystem only looks
  # for .tf files directly inside the given directory (non-recursive),
  # and infra/ itself has none at its own top level; every real module
  # lives one or two levels down (infra/modules/<name>[/<cloud>],
  # infra/environments/<name>). Fixed with explicit globs for each real
  # depth instead of guessing a recursive pattern would work.
  - package-ecosystem: "terraform"
    directories:
      - "/infra/environments/*"
      - "/infra/modules/*"
      - "/infra/modules/*/*"
    schedule:
      interval: "weekly"
    groups:
      per-dependency:
        group-by: dependency-name
    open-pull-requests-limit: 10

  # Docker base images used by each service's Dockerfile (only some
  # services have one -- see docker-compose.yml's own top comment for
  # which are actually part of the compose stack; a directory with no
  # Dockerfile is silently skipped). Same grouping rationale as pip
  # above -- most of these Dockerfiles share the same base image name.
  - package-ecosystem: "docker"
    directories:
      - "/services/*"
    schedule:
      interval: "weekly"
    groups:
      per-dependency:
        group-by: dependency-name
    open-pull-requests-limit: 10
