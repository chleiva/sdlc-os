apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-{{ .Values.environment }}
  labels:
    app.kubernetes.io/name: ollama
    sdlc-auto.io/tenant-id: {{ .Values.tenantId | quote }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
      sdlc-auto.io/environment: {{ .Values.environment | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
        sdlc-auto.io/environment: {{ .Values.environment | quote }}
        sdlc-auto.io/tenant-id: {{ .Values.tenantId | quote }}
      annotations:
        sdlc-auto.io/model-name: {{ .Values.model.name | quote }}
    spec:
      # Only set when service_account_role_arn is configured (see
      # ../serviceaccount.yaml) -- the model-cache-restore init container
      # below is the only thing on this pod that currently needs real AWS
      # credentials, via IRSA.
      {{- if .Values.serviceAccount.roleArn }}
      serviceAccountName: ollama-{{ .Values.environment }}
      {{- end }}
      # No sized-against-a-signal preStop drain hook here, unlike
      # modules/model-serving/chart's vLLM deployment: this tier is the
      # spot-only, scale-to-zero KEDA/Karpenter-driven tier (see
      # modules/gpu-node-pool/aws's spot-only NodePool parameterization
      # and this module's own ScaledObject in ../../main.tf) where the
      # normal steady-state termination path IS the scale-to-zero one
      # (KEDA scales the Deployment to 0 first, deleting the pod on its
      # own schedule -- not a surprise reclaim mid-request). A genuine
      # spot *interruption* notice for a node this pool happens to still
      # own still goes through spot-lifecycle's NTH-driven cordon/drain
      # exactly like any other pod on a gpu-node-pool/aws node; this
      # value is plain kubelet SIGTERM grace, not a sized step budget.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.modelCache.s3Uri }}
      volumes:
        - name: ollama-models
          emptyDir: {}
      initContainers:
        # Restores Ollama's on-disk model store into the emptyDir volume
        # below from S3 before the main container starts, so a fresh pod
        # does not have to `ollama pull` a fresh ~23GB model from
        # Ollama's public registry on every cold start (see README
        # "Restoring the model cache from S3"). `aws s3 sync` is
        # incremental/idempotent and simply copies nothing if the
        # prefix is empty (first-ever run, or a misconfigured bucket) --
        # the postStart `ollama pull` below stays in place
        # unconditionally as the real fallback for that case, this is
        # not an either/or.
        - name: restore-model-cache
          image: "{{ .Values.modelCache.awsCliImage }}:{{ .Values.modelCache.awsCliImageTag }}"
          command:
            - /bin/sh
            - -c
            - |
              echo "Restoring Ollama model cache from {{ .Values.modelCache.s3Uri }} into /ollama-models ..."
              aws s3 sync "{{ .Values.modelCache.s3Uri }}" /ollama-models --no-progress
              echo "Restore step finished (an empty prefix here is expected on first-ever run -- the postStart ollama pull below is the real fallback for that case)."
          volumeMounts:
            - name: ollama-models
              mountPath: /ollama-models
      {{- end }}
      containers:
        - name: ollama
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- if .Values.modelCache.s3Uri }}
          env:
            # Ollama's documented override for its default model-store
            # path (normally ~/.ollama/models, i.e. /root/.ollama/models
            # in this image): points it at the emptyDir volume the init
            # container above restored from S3 instead. This directory
            # holds Ollama's `blobs/`/`manifests/` layout directly, not
            # a nested `.ollama/` dir -- that's how OLLAMA_MODELS is
            # documented to work. Unset (chart default): Ollama stays on
            # its built-in default path with no volume at all --
            # unchanged pre-existing behavior.
            - name: OLLAMA_MODELS
              value: /ollama-models
          volumeMounts:
            - name: ollama-models
              mountPath: /ollama-models
          {{- end }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
          lifecycle:
            postStart:
              exec:
                # Pulls {{ .Values.model.name }} into the container's
                # local model store (OLLAMA_MODELS, if set above) on
                # every pod start, per this deliverable's brief. Kept
                # unconditionally, including when `modelCache.s3Uri` is
                # set: `ollama pull` checks what is already on disk and
                # is a no-op once the model is already present, so this
                # is a real, safe fallback for "the S3 restore above
                # came up empty" (first-ever run, or a misconfigured
                # bucket/prefix) -- not a slow redundant step in the
                # common case, and not an either/or with the restore
                # above.
                # THIS IS SLOW AND BANDWIDTH-HEAVY THE FIRST TIME:
                # ornith-1.5-35b-a3b is a ~23GB quantized model. Without
                # `modelCache.s3Uri` set, this re-runs from scratch on
                # every fresh pod (see README "Restoring the model cache
                # from S3" for the mitigation, and "Known follow-up" for
                # the two credible fixes not taken). The Ollama server
                # itself comes up and answers management endpoints (`/`,
                # `/api/tags`) immediately; the FIRST real inference
                # request against {{ .Values.model.name }} blocks until
                # this step finishes (whether that's a fast no-op
                # because S3 already restored it, or a full pull).
                # postStart has no ordering guarantee against the main
                # container process actually being ready to accept
                # connections, so this polls the server's own port first
                # rather than assuming it's already up.
                command:
                  - /bin/sh
                  - -c
                  - |
                    for i in $(seq 1 60); do
                      curl -fs "http://localhost:{{ .Values.service.port }}/" >/dev/null 2>&1 && break
                      sleep 2
                    done
                    ollama pull {{ .Values.model.name }}
          # No dedicated /health path in Ollama's API (unlike vLLM) --
          # root `/` is the documented liveness/readiness equivalent
          # ("Ollama is running"). A generous failureThreshold because
          # this only proves the SERVER is up, not that the pull above
          # has finished -- see the postStart comment.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-{{ .Values.environment }}
  labels:
    app.kubernetes.io/name: ollama
spec:
  selector:
    app.kubernetes.io/name: ollama
    sdlc-auto.io/environment: {{ .Values.environment | quote }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
