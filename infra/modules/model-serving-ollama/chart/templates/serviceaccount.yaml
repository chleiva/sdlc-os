# Rendered only when the pod needs real AWS credentials -- currently only
# the model-cache-restore init container's `aws s3 sync` call
# (deployment.yaml) needs any. Same conditional-annotation idiom as
# modules/observability's kubernetes_service_account_v1.eso_grafana:
# annotate with eks.amazonaws.com/role-arn only when a role ARN is
# actually supplied; omitted (rather than rendered with an empty
# annotation) when it is not, so `helm template`/`tofu plan` output is
# identical to before this feature existed unless it is actually used.
{{- if .Values.serviceAccount.roleArn }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ollama-{{ .Values.environment }}
  labels:
    app.kubernetes.io/name: ollama
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn | quote }}
{{- end }}
