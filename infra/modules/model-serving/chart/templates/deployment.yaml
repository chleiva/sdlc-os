apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-{{ .Values.environment }}
  labels:
    app.kubernetes.io/name: vllm
    sdlc-auto.io/tenant-id: {{ .Values.tenantId | quote }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
      sdlc-auto.io/environment: {{ .Values.environment | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
        sdlc-auto.io/environment: {{ .Values.environment | quote }}
        sdlc-auto.io/tenant-id: {{ .Values.tenantId | quote }}
      annotations:
        sdlc-auto.io/model-weight-checksum: {{ .Values.model.weightChecksum | quote }}
    spec:
      # Spot-lifecycle's warning-window budget (spec §14.8) sizes this so a
      # cordon->stop-accepting-requests->drain sequence has time to finish
      # before SIGKILL. See modules/spot-lifecycle/README.md for the split
      # of responsibility between the node-level watcher and this preStop
      # hook.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: vllm
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          args:
            - "--model={{ .Values.model.artifactUri }}"
            - "--tensor-parallel-size={{ .Values.model.tensorParallel }}"
            - "--gpu-memory-utilization={{ .Values.model.gpuUtilization }}"
            - "--served-model-name=sdlc-auto-primary"
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          lifecycle:
            preStop:
              # Best-effort default: ask vLLM's OpenAI-compatible server to
              # stop taking new work, then give in-flight requests the rest
              # of the grace period to finish (spec §14.8 step 2/3). vLLM
              # does not ship a dedicated "drain" endpoint as of this
              # writing — this hits a health-style path defensively and is
              # expected to be replaced by D6/D2 with a real drain signal
              # once the model-serving tenant-cell provisioning logic
              # (wave1-D6) exists. Documented here rather than silently
              # assumed correct.
              exec:
                command: ["/bin/sh", "-c", "curl -s -X POST http://localhost:{{ .Values.service.port }}/stop_accepting 2>/dev/null || true; sleep 5"]
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-{{ .Values.environment }}
  labels:
    app.kubernetes.io/name: vllm
spec:
  selector:
    app.kubernetes.io/name: vllm
    sdlc-auto.io/environment: {{ .Values.environment | quote }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
