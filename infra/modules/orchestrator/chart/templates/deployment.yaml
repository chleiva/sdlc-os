apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-{{ .Values.environment }}
  labels:
    app.kubernetes.io/name: orchestrator
    sdlc-auto.io/tenant-id: {{ .Values.tenantId | quote }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: orchestrator
      sdlc-auto.io/environment: {{ .Values.environment | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orchestrator
        sdlc-auto.io/environment: {{ .Values.environment | quote }}
        sdlc-auto.io/tenant-id: {{ .Values.tenantId | quote }}
      {{- if .Values.meshInjectionEnabled }}
      annotations:
        linkerd.io/inject: enabled
      {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: orchestrator
          # PLACEHOLDER image — see values.yaml and this chart's README.
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
          env:
            - name: MODEL_SERVING_ENDPOINT
              value: {{ .Values.modelServingEndpoint | quote }}
            - name: TENANT_ID
              value: {{ .Values.tenantId | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-{{ .Values.environment }}
  labels:
    app.kubernetes.io/name: orchestrator
spec:
  selector:
    app.kubernetes.io/name: orchestrator
    sdlc-auto.io/environment: {{ .Values.environment | quote }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
