# D14 -- optional observability profile: minimal single-binary Tempo,
# local-disk-backed (no object storage/cluster needed for one host).
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
        grpc:

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
